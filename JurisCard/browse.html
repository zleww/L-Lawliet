<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Laws | JurisCards</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #071525;
      --navy-light: #0c2035;
      --navy-card: #0e263d;
      --gold: #c9a45c;
      --gold-light: #e0c27d;
      --white: #f7f5ef;
      --muted: #aeb8c4;
      --border: rgba(201, 164, 92, 0.25);
      --paper: #f5f2eb;
      --ink: #142333;
      --line: #dedbd3;
      --card-white: #ffffff;
      --accent-red: #c53030;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { text-decoration: none; color: inherit; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .container {
      width: min(1200px, 92%);
      margin: auto;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      width: 100%;
      height: 74px;
      z-index: 1000;
      background: var(--navy);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .navbar {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Playfair Display", serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--white);
      flex: 1;
    }

    .logo-symbol {
      color: var(--gold);
      font-size: 26px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      flex: 2;
    }

    .nav-links a {
      font-size: 14px;
      color: #cbd3dc;
      transition: 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--gold-light);
    }

    .header-action {
      display: flex;
      justify-content: flex-end;
      flex: 1;
    }

    .header-btn {
      padding: 9px 20px;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      border-radius: 2px;
      transition: 0.25s ease;
      white-space: nowrap;
    }

    .header-btn:hover {
      background: var(--gold);
      color: var(--navy);
    }

    /* HERO */
    .hero {
      background: var(--navy);
      color: var(--white);
      padding: 60px 0 50px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .hero-content {
      max-width: 800px;
    }

    .eyebrow {
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hero h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(34px, 4vw, 46px);
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .gold-text {
      color: var(--gold-light);
    }

    .hero p {
      color: #cbd3dc;
      font-size: 15px;
    }

    .search-container {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      max-width: 650px;
    }

    .search-container input {
      flex: 1;
      padding: 13px 18px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      font-size: 14px;
      outline: none;
    }

    .search-container input:focus {
      border-color: var(--gold);
    }

    .search-btn {
      padding: 0 24px;
      background: var(--gold);
      color: var(--navy);
      border: 1px solid var(--gold);
      border-radius: 4px;
      font-weight: 700;
      font-size: 13px;
      transition: 0.2s ease;
    }

    .search-btn:hover {
      background: var(--gold-light);
    }

    /* FILTER SECTION */
    .filter-section {
      padding: 30px 0 10px;
    }

    #categoryFilters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-btn {
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      background: #ffffff;
      color: var(--ink);
      border: 1px solid var(--line);
      transition: 0.2s ease;
    }

    .filter-btn.active-filter,
    .filter-btn:hover {
      background: var(--navy);
      border-color: var(--navy);
      color: var(--white);
    }

    /* LAWS GRID */
    main.content-wrapper {
      flex: 1;
      padding: 20px 0 80px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--card-white);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.25s ease;
      cursor: pointer;
    }

    .card:hover {
      border-color: var(--gold);
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(7, 21, 37, 0.06);
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #927438;
      font-weight: 700;
    }

    .card h3 {
      font-family: "Playfair Display", serif;
      color: var(--gold);
      font-size: 20px;
      margin-bottom: 4px;
    }

    .card h4 {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .card p.summary {
      font-size: 13px;
      color: #68717b;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .click-more {
      font-size: 12px;
      font-weight: 700;
      color: #927438;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(7, 21, 37, 0.88);
      backdrop-filter: blur(5px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 6px;
      padding: 34px;
      border: 1px solid var(--line);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 22px;
      background: none;
      border: none;
      font-size: 26px;
      color: #7b858d;
      cursor: pointer;
    }

    .meta-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      background: var(--navy);
      color: var(--white);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 4px;
      margin: 20px 0;
    }

    .meta-panel span {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
    }

    .meta-panel strong {
      font-size: 13px;
      color: var(--gold-light);
    }

    .detail-section {
      margin-bottom: 16px;
    }

    .detail-section h4 {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #927438;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .detail-section p {
      font-size: 14px;
      color: var(--ink);
      line-height: 1.6;
    }

    .comment-bubble {
      background: #faf8f5;
      border: 1px solid var(--line);
      padding: 10px 14px;
      border-radius: 4px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .delete-comment-btn {
      background: none;
      border: none;
      color: var(--accent-red);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .comment-form input,
    .comment-form textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }

    .comment-form input:focus,
    .comment-form textarea:focus {
      border-color: var(--gold);
    }

    .comment-form button {
      padding: 10px 20px;
      background: var(--navy);
      color: var(--white);
      border: none;
      font-weight: 600;
      font-size: 13px;
      border-radius: 4px;
    }

    .comment-form button:hover {
      background: var(--gold);
      color: var(--navy);
    }

    /* FOOTER */
    footer {
      padding: 28px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: #050f1b;
      color: #778493;
    }

    .footer-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: "Playfair Display", serif;
      font-size: 19px;
      color: var(--white);
    }

    .footer-logo span {
      color: var(--gold);
    }

    .copyright {
      font-size: 11px;
    }

    @media (max-width: 840px) {
      .nav-links { display: none; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">
        <span class="logo-symbol">⚖</span>
        JurisCards
      </a>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="browse.html" class="active">Browse Laws</a>
      </nav>

      <div class="header-action">
        <a href="browse.html" class="header-btn">Start Studying</a>
      </div>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="container hero-content">
      <div class="eyebrow">Philippine Statutory Repository</div>
      <h1>Browse All <span class="gold-text">Republic Acts.</span></h1>
      <p>Explore our complete database of Philippine laws explained in plain English. Use the search bar or category filters below.</p>
      
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search by RA number, keyword, or topic (e.g. Libel, TRAIN, Bawal Bastos)..." />
        <button class="search-btn" id="searchSubmitBtn">Search</button>
      </div>
    </div>
  </section>

  <!-- CATEGORY FILTERS -->
  <section class="container filter-section">
    <div id="categoryFilters">
      <button class="filter-btn active-filter" data-category="All">All Laws</button>
      <button class="filter-btn" data-category="Technology & Crime">Technology & Crime</button>
      <button class="filter-btn" data-category="Finance & Taxes">Finance & Taxes</button>
      <button class="filter-btn" data-category="Governance & Business">Governance & Business</button>
      <button class="filter-btn" data-category="Social & Welfare">Social & Welfare</button>
      <button class="filter-btn" data-category="Environment">Environment</button>
    </div>
  </section>

  <!-- MAIN LAWS GRID -->
  <main class="container content-wrapper">
    <div id="lawsGrid" class="grid"></div>
  </main>

  <!-- MODAL DEEP DIVE -->
  <div id="lawModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close-btn">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="container footer-content">
      <div class="footer-logo"><span>⚖</span> JurisCards</div>
      <div class="copyright">&copy; 2026 JurisCards. Philippine Law Study Platform.</div>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const API_KEY = "student-api-key-123";
      const lawsGrid = document.getElementById("lawsGrid");
      const searchInput = document.getElementById("searchInput");
      const searchSubmitBtn = document.getElementById("searchSubmitBtn");
      const filterButtons = document.querySelectorAll(".filter-btn");
      const modal = document.getElementById("lawModal");
      const modalBody = document.getElementById("modalBody");
      const closeModal = document.getElementById("closeModal");

      let allLaws = [];
      let currentCategory = "All";

      // 1. Check URL parameters (?search=... or ?category=...)
      const urlParams = new URLSearchParams(window.location.search);
      const initialSearchQuery = urlParams.get("search");
      const initialCategory = urlParams.get("category");

      if (initialSearchQuery && searchInput) {
        searchInput.value = initialSearchQuery;
      }

      if (initialCategory) {
        currentCategory = initialCategory;
        filterButtons.forEach(btn => {
          if (btn.getAttribute("data-category").toLowerCase() === initialCategory.toLowerCase()) {
            btn.classList.add("active-filter");
          } else {
            btn.classList.remove("active-filter");
          }
        });
      }

      // 2. Fetch laws from FastAPI backend
      async function fetchLaws() {
        try {
          const response = await fetch('/api/v1/laws', {
            headers: { 'x-api-key': API_KEY }
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();
          allLaws = Array.isArray(data) ? data : (data.laws || []);

          // Sync local notes
          const savedNotes = JSON.parse(localStorage.getItem("juris_law_notes") || "{}");
          allLaws.forEach(law => {
            if (savedNotes[law.id]) {
              law.user_notes = savedNotes[law.id];
            } else if (!law.user_notes) {
              law.user_notes = [];
            }
          });

          filterAndDisplay();
        } catch (error) {
          console.error("Fetch error on browse page:", error);
          if (lawsGrid) {
            lawsGrid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">Failed to load laws from the backend. Please check your connection or server status.</p>`;
          }
        }
      }

      // 3. Filter & Render
      function filterAndDisplay() {
        const query = searchInput ? searchInput.value.toLowerCase().trim() : "";

        const filtered = allLaws.filter(law => {
          const matchesCategory = currentCategory === "All" || law.category === currentCategory;
          const matchesSearch = !query ||
            (law.ra_number && law.ra_number.toLowerCase().includes(query)) ||
            (law.plain_title && law.plain_title.toLowerCase().includes(query)) ||
            (law.official_title && law.official_title.toLowerCase().includes(query)) ||
            (law.tldr_summary && law.tldr_summary.toLowerCase().includes(query)) ||
            (law.category && law.category.toLowerCase().includes(query)) ||
            (law.enacting_president && law.enacting_president.toLowerCase().includes(query)) ||
            (law.target_audience && law.target_audience.toLowerCase().includes(query));

          return matchesCategory && matchesSearch;
        });

        displayLaws(filtered);
      }

      function displayLaws(laws) {
        lawsGrid.innerHTML = "";

        if (laws.length === 0) {
          lawsGrid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 50px;">No laws found matching your search or category filter.</p>`;
          return;
        }

        laws.forEach(law => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div>
              <div class="card-top-row">
                <span class="badge">${law.category}</span>
                <span style="color: var(--muted); font-size: 12px;">Enacted ${law.year || 'N/A'}</span>
              </div>
              <h3>${law.ra_number}</h3>
              <h4>${law.plain_title}</h4>
              <p class="summary">${law.tldr_summary}</p>
            </div>
            <span class="click-more">View Statutory Breakdown &rarr;</span>
          `;

          card.addEventListener("click", () => openModal(law));
          lawsGrid.appendChild(card);
        });
      }

      // 4. Search Listeners
      if (searchInput) {
        searchInput.addEventListener("input", filterAndDisplay);
      }
      if (searchSubmitBtn) {
        searchSubmitBtn.addEventListener("click", filterAndDisplay);
      }

      // 5. Category Filters
      filterButtons.forEach(btn => {
        btn.addEventListener("click", (e) => {
          filterButtons.forEach(b => b.classList.remove("active-filter"));
          e.target.classList.add("active-filter");
          currentCategory = e.target.getAttribute("data-category");
          filterAndDisplay();
        });
      });

      // 6. Deep Dive Modal
      function openModal(law) {
        if (!law.user_notes) law.user_notes = [];

        const formattedFine = law.min_fine_php 
          ? `₱${Number(law.min_fine_php).toLocaleString()}` 
          : "None / Discretionary";

        modalBody.innerHTML = `
          <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
            <span style="background: rgba(201, 164, 92, 0.15); color: var(--gold); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;">${law.category} (${law.year})</span>
            <span style="background: #eceff1; color: var(--navy); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;">Status: ${law.status || 'Active'}</span>
            <span style="background: #eceff1; color: #59636d; padding: 4px 10px; border-radius: 20px; font-size: 11px;">⏱️ ${law.reading_time_minutes || 3} min read</span>
          </div>

          <h2 style="font-family: 'Playfair Display', serif; font-size: 26px; color: var(--navy); margin-bottom: 4px;">${law.ra_number}: ${law.plain_title}</h2>
          <p style="color: #68717b; font-style: italic; font-size: 13.5px; margin-bottom: 18px;">"${law.official_title}" &bull; System ID #${law.id}</p>

          <div class="meta-panel">
            <div>
              <span>Enacting President</span>
              <strong>${law.enacting_president || 'Executive Office'}</strong>
            </div>
            <div>
              <span>Total Sections</span>
              <strong>${law.total_sections || 'Statutory Code'}</strong>
            </div>
            <div>
              <span>Base Minimum Fine</span>
              <strong>${formattedFine}</strong>
            </div>
            <div style="grid-column: 1 / -1;">
              <span>Target Scope</span>
              <strong>${law.target_audience || 'General Public'}</strong>
            </div>
          </div>

          <div class="detail-section">
            <h4>Quick Summary (TL;DR)</h4>
            <p>${law.tldr_summary}</p>
          </div>

          <div class="detail-section">
            <h4>Full Simplified Breakdown</h4>
            <p>${law.full_breakdown || law.tldr_summary}</p>
          </div>

          <div class="detail-section">
            <h4>Why It Matters</h4>
            <p>${law.why_it_matters || 'Protects public rights and establishes statutory penalties.'}</p>
          </div>

          <div class="detail-section">
            <h4>Example Scenario</h4>
            <p>${law.example_scenario || 'Application varies based on judicial merits.'}</p>
          </div>

          <div class="detail-section">
            <h4>Penalties & Violations</h4>
            <p>${law.penalties || 'Judicial discretion and statutory fines apply.'}</p>
          </div>

          <div class="detail-section">
            <h4>Official Source</h4>
            <a href="${law.source_url}" target="_blank" rel="noopener noreferrer" style="color: var(--gold); text-decoration: underline; font-size: 13.5px; font-weight: 600;">Read Official Gazette Filing &rarr;</a>
          </div>

          <hr style="border: 0; border-top: 1px solid var(--line); margin: 25px 0;">

          <h3 style="font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 12px;">Community Notes & Tips</h3>
          <div id="commentsList">
            ${law.user_notes.length > 0 
              ? law.user_notes.map((n, i) => `
                  <div class="comment-bubble" data-index="${i}">
                    <span><strong>${n.user_name}:</strong>${n.comment}</span>
                    <button class="delete-comment-btn">Delete</button>
                  </div>
                `).join('') 
              : '<p style="color: #7b858d; font-size: 13px; margin-bottom: 12px;">No notes yet. Be the first to post a study tip!</p>'}
          </div>

          <div class="comment-form" style="margin-top: 15px;">
            <input type="text" id="userNameInput" placeholder="Your Name (e.g. Juan D.)">
            <textarea id="userCommentInput" placeholder="Write a note, mnemonic, or study tip..." rows="3"></textarea>
            <button id="submitCommentBtn">Post Note</button>
          </div>
        `;

        modal.classList.remove("hidden");

        // Delete note
        modalBody.querySelectorAll(".delete-comment-btn").forEach(btn => {
          btn.addEventListener("click", (e) => {
            const bubble = e.target.closest(".comment-bubble");
            const idx = Number(bubble.dataset.index);
            law.user_notes.splice(idx, 1);
            saveNotesToStorage(law.id, law.user_notes);
            openModal(law);
          });
        });

        // Add note
        const submitBtn = document.getElementById("submitCommentBtn");
        submitBtn.addEventListener("click", () => {
          const nameInput = document.getElementById("userNameInput").value.trim();
          const commentInput = document.getElementById("userCommentInput").value.trim();

          if (nameInput && commentInput) {
            law.user_notes.push({ user_name: nameInput, comment: commentInput });
            saveNotesToStorage(law.id, law.user_notes);
            openModal(law);
          }
        });
      }

      function saveNotesToStorage(lawId, notes) {
        const savedNotes = JSON.parse(localStorage.getItem("juris_law_notes") || "{}");
        savedNotes[lawId] = notes;
        localStorage.setItem("juris_law_notes", JSON.stringify(savedNotes));
      }

      // Close modal
      if (closeModal) {
        closeModal.addEventListener("click", () => modal.classList.add("hidden"));
      }
      window.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.add("hidden");
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !modal.classList.contains("hidden")) {
          modal.classList.add("hidden");
        }
      });

      // Initial execution
      fetchLaws();
    });
  </script>
</body>
</html>
